spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/revisor}
    username: ${SPRING_DATASOURCE_USERNAME:revisor}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  flyway:
    locations: classpath:db/migration/postgresql

app:
  jwt:
    # A persistent pair, so sessions survive a restart. Create it once with
    # scripts/generate-jwt-keys.sh (writes to the gitignored secrets/). The defaults are relative to
    # the backend directory, where ./gradlew bootRun runs; the env vars override them.
    private-key-path: ${JWT_PRIVATE_KEY_PATH:secrets/jwt_private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:secrets/jwt_public.pem}
  cookies:
    secure: false
  cors:
    allowed-origins:
      - http://localhost:5173
