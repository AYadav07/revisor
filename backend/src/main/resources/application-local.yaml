spring:
  datasource:
    url: jdbc:h2:mem:revisor;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    locations: classpath:db/migration/h2

app:
  jwt:
    # Local-only convenience: a fresh key pair per start, so tokens don't survive a restart.
    generate-ephemeral-keys: true
  cookies:
    secure: false
  cors:
    allowed-origins:
      - http://localhost:5173
  mail:
    # No SMTP server in the in-memory profile: emails are noted in the log, not sent. Use the dev
    # profile with Mailpit (backend/docker-compose.yml) to receive and click real links.
    transport: log
    from: "Revisor <noreply@localhost>"
    frontend-url: http://localhost:5173
  notifications:
    retry-backoff: 50ms
