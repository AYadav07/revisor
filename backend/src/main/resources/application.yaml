spring:
  application:
    name: revisor
  profiles:
    default: dev
  autoconfigure:
    # We authenticate via JWT cookies, never username/password through Spring's user store.
    # Left on, Boot creates an unused in-memory user and logs its generated password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # Only health is reachable — no env, beans, metrics or heapdump (SECURITY.md: minimal surface).
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      # An email provider blip must not mark the whole backend unhealthy and get it restarted
      # (DEPLOYMENT.md "Observability"); delivery failures show up in the logs instead.
      enabled: false

app:
  notifications:
    # Which channels each notification goes out on (ARCHITECTURE.md §8). Adding SMS later = a line here.
    # Brackets keep the enum names intact as map keys.
    routes:
      "[VERIFY_EMAIL]": [EMAIL]
      "[PASSWORD_RESET]": [EMAIL]

logging:
  pattern:
    # Every log line carries the request id set by RequestIdFilter (blank outside a request).
    correlation: "[%X{requestId:-}] "
