# Production: everything environment-specific comes from env vars — nothing secret or
# host-specific is committed (SECURITY.md "Secrets management", DEPLOYMENT.md).
spring:
  # SMTP2GO in production (DEPLOYMENT.md "Email delivery"). Port 587 with STARTTLS — GCP blocks port 25.
  # Switching provider = new values here, never new code.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    locations: classpath:db/migration/postgresql

server:
  # The backend sits behind the Caddy reverse proxy, so the socket peer is always Caddy. This makes the
  # servlet API report the real client IP from X-Forwarded-For — which the signup rate limit keys on.
  # Only safe while nothing but the proxy can reach the backend port (DEPLOYMENT.md).
  forward-headers-strategy: native

logging:
  structured:
    format:
      console: ecs # one JSON object per line, including the requestId MDC value

springdoc:
  # Swagger/OpenAPI is off in production (SECURITY.md).
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
  cookies:
    secure: true
  cors:
    # Comma-separated exact origins, e.g. https://revisor.aydev.in. Never a wildcard.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  mail:
    from: ${APP_MAIL_FROM}               # e.g. "Revisor <noreply@aydev.in>"
    frontend-url: ${APP_FRONTEND_URL}    # e.g. https://revisor.aydev.in — base of the links in emails
