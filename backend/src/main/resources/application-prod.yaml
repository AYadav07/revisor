# Production: everything environment-specific comes from env vars — nothing secret or
# host-specific is committed (SECURITY.md "Secrets management", DEPLOYMENT.md).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    locations: classpath:db/migration/postgresql

server:
  # The backend sits behind the Caddy reverse proxy, so the socket peer is always Caddy. This makes the
  # servlet API report the real client IP from X-Forwarded-For — which the signup rate limit keys on.
  # Only safe while nothing but the proxy can reach the backend port (DEPLOYMENT.md).
  forward-headers-strategy: native

logging:
  structured:
    format:
      console: ecs # one JSON object per line, including the requestId MDC value

springdoc:
  # Swagger/OpenAPI is off in production (SECURITY.md).
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
  cookies:
    secure: true
  cors:
    # Comma-separated exact origins, e.g. https://app.<your-domain>. Never a wildcard.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
